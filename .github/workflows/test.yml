name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      run: python -m pip install uv
    - name: Check dependency lock
      run: uv lock --check
    - name: Install dependencies
      run: uv sync --locked --extra dev --extra server --extra convert --extra indextts2 --extra asr --extra video_localization
    - name: Install media test tools
      run: |
        brew install ffmpeg
        ffmpeg -version
        ffprobe -version
    - name: Run tests
      run: .venv/bin/python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install frontend dependencies
      run: pnpm --dir frontend install --frozen-lockfile
    - name: Run frontend regression tests
      run: pnpm --dir frontend test
    - name: Check frontend types and Svelte contracts
      run: pnpm --dir frontend check
    - name: Build frontend
      run: pnpm --dir frontend build

  distribution:
    name: Python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install packaging tools
      run: python -m pip install build twine
    - name: Build source and wheel distributions
      run: python -m build
    - name: Validate package metadata
      run: python -m twine check dist/*
    - name: Smoke-test the dependency-free CLI entrypoint
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/voice-studio-wheel-smoke"
        "$RUNNER_TEMP/voice-studio-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
        "$RUNNER_TEMP/voice-studio-wheel-smoke/bin/voice-studio" --help

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install portable test dependencies
      run: python -m pip install pytest numpy soundfile
    - name: Run cross-platform contracts
      run: >-
        python -m pytest -q
        tests/test_voice_studio_doctor.py
        tests/test_start_script_contract.py
        tests/test_python_runtime.py
        tests/test_interprocess_lock.py
        tests/test_persistent_worker_protocol.py
        tests/test_package_platform_contract.py
        tests/test_open_source_release_gate.py
    - name: Verify open-source release contents
      run: python scripts/verify_open_source_release.py
    - name: Parse the Windows preflight entrypoint
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $tokens = $null
        $parseErrors = $null
        [System.Management.Automation.Language.Parser]::ParseFile(
          (Resolve-Path .\start.ps1).Path,
          [ref]$tokens,
          [ref]$parseErrors
        ) | Out-Null
        if ($parseErrors.Count -gt 0) {
          $parseErrors | ForEach-Object { Write-Error $_.Message }
          exit 1
        }
