[project]
name = "voice-studio"
version = "1.0.0"
description = "Multi-engine TTS platform for Apple Silicon — local voice cloning, emotion control, long-form orchestration, and cloud synthesis via WebUI and API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Voice Studio Contributors" }]
keywords = ["tts", "text-to-speech", "mlx", "apple-silicon", "voice-cloning", "voice-studio", "fastapi", "multi-engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.18.0",
    "numpy>=1.24.0",
    "sentencepiece>=0.2.0",
    "soundfile>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "huggingface-hub>=0.20.0",
    "wetext>=0.1.2",
    "psutil>=7.2.2",
    "bigvgan>=2.4.1",
    "omnivoice>=0.1.5",
    "omegaconf>=2.3.0",
    "einops>=0.8.2",
]

[project.optional-dependencies]
convert = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
v2 = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "omegaconf>=2.3.0",
    "librosa>=0.10.0",
]
asr = [
    "mlx-audio>=0.3.1",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]

[project.scripts]
voice-studio = "mlx_indextts.cli:main"
mlx-indextts = "mlx_indextts.cli:main"

[project.urls]
Homepage = "https://github.com/foxmacstudio/voice-studio"
Repository = "https://github.com/foxmacstudio/voice-studio"
Issues = "https://github.com/foxmacstudio/voice-studio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlx_indextts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
]
